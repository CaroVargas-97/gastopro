<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GastosPRO">
<meta name="theme-color" content="#5b4eff">
<link rel="manifest" href="/manifest.json">
<title>GastosPRO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --accent:#5b4eff;--accent2:#4338e0;--accent-soft:rgba(91,78,255,.1);
  --bg:#eeede9;--bg2:#ffffff;--bg3:#e6e4df;
  --border:#dddbd5;--border2:#c9c6bf;
  --text:#141210;--text2:#6b6760;--text3:#b0ada6;
  --green:#059669;--red:#e11d48;
  --radius:18px;--radius-sm:12px;
  --shadow:0 1px 4px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
  --shadow-sm:0 1px 3px rgba(0,0,0,.05);
  --shadow-btn:0 4px 16px rgba(91,78,255,.3);
}
html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);font-size:15px}

/* LOGIN */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:var(--bg)}
.login-card{background:var(--bg2);border-radius:24px;padding:32px 24px;width:100%;max-width:360px;box-shadow:var(--shadow)}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.login-logo-box{width:40px;height:40px;background:var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
.login-logo-name{font-size:19px;font-weight:700;letter-spacing:-.3px}
.login-title{font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:-.4px}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:24px}
.flabel{display:block;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.finput{width:100%;height:48px;border:1.5px solid var(--border2);border-radius:var(--radius-sm);padding:0 14px;font-size:15px;background:#fff;color:var(--text);outline:none;-webkit-appearance:none;transition:border-color .18s,box-shadow .18s}
.finput:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ff{margin-bottom:16px}
.btn-login{width:100%;height:52px;background:var(--accent);border:none;border-radius:var(--radius-sm);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px;box-shadow:var(--shadow-btn);transition:opacity .15s,transform .1s;letter-spacing:.01em}
.btn-login:active{opacity:.9;transform:scale(.98)}
.login-err{font-size:13px;color:var(--red);margin-top:10px;text-align:center;min-height:18px}
.pass-wrap{position:relative}
.pass-wrap .finput{padding-right:44px}
.eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);font-size:20px;display:flex;align-items:center;padding:4px}

/* APP */
#app{display:none;flex-direction:column;height:100vh;height:100dvh}

/* TOPBAR */
.topbar{background:var(--bg2);box-shadow:0 1px 0 var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-logo{display:flex;align-items:center;gap:10px}
.topbar-box{width:32px;height:32px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.topbar-name{font-size:16px;font-weight:700;letter-spacing:-.3px}
.topbar-user{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:6px}
.logout-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;padding:6px;display:flex;align-items:center}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:20px 16px;padding-bottom:90px}

/* FORM */
.section-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}
.form-card{background:var(--bg2);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.minput{width:100%;height:48px;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:0 14px;font-size:15px;background:#fff;color:var(--text);outline:none;-webkit-appearance:none;transition:border-color .18s,box-shadow .18s;font-family:inherit}
.minput:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn-save{width:100%;height:52px;background:var(--accent);border:none;border-radius:var(--radius-sm);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow-btn);transition:opacity .15s,transform .1s;letter-spacing:.01em}
.btn-save:active{opacity:.9;transform:scale(.98)}
.btn-save:disabled{background:var(--border2);box-shadow:none;cursor:not-allowed}

/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#141210;color:#fff;font-size:13px;font-weight:500;padding:11px 22px;border-radius:40px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.show{opacity:1}

/* BOTTOM NAV */
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);box-shadow:0 -1px 0 var(--border),0 -4px 20px rgba(0,0,0,.05);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 0 10px;gap:4px;background:none;border:none;cursor:pointer;color:var(--text3);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.nav-tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-tab.active{color:var(--accent)}

/* HISTORIAL */
.hist-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:0}
.hist-list{display:flex;flex-direction:column;gap:6px}
.hist-item{background:var(--bg2);border-radius:var(--radius-sm);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)}
.hist-icon{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.hist-info{flex:1;min-width:0}
.hist-desc{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);letter-spacing:-.1px}
.hist-sub{font-size:11px;color:var(--text3);margin-top:2px}
.hist-amt{font-size:15px;font-weight:700;color:var(--text);flex-shrink:0;letter-spacing:-.3px}
.hist-empty{font-size:13px;color:var(--text3);text-align:center;padding:24px 0}
.hist-loading{font-size:12px;color:var(--text3);text-align:center;padding:16px 0}
.edit-hist-btn{background:none;border:none;cursor:pointer;color:var(--text3);padding:6px;display:flex;align-items:center}
.edit-hist-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* FECHA BUTTON */
.fecha-btn{width:100%;height:48px;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:0 14px;font-size:14px;background:#fff;color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;gap:6px;font-weight:500;transition:border-color .18s}
.fecha-btn:active{border-color:var(--accent)}
.fecha-btn-arrow{font-size:11px;color:var(--text3)}

/* CAL MODAL */
.cal-modal{background:var(--bg2);border-radius:24px 24px 0 0;padding:20px 20px 36px;width:100%;max-height:85vh;overflow-y:auto}
.cal-modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-modal-month{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.2px}
.cal-modal-nav{background:var(--bg3);border:none;cursor:pointer;color:var(--text2);font-size:18px;padding:4px 12px;border-radius:8px;line-height:1}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:16px}
.cal-dow{font-size:9px;font-weight:700;color:var(--text3);text-align:center;padding-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
.cal-cell{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border-radius:10px;cursor:pointer;min-height:36px;gap:3px;transition:background .1s}
.cal-cell:active{background:var(--bg3)}
.cal-cell.selected{background:var(--accent)}
.cal-cell.selected .cal-dn{color:#fff;font-weight:700}
.cal-cell.selected .cal-dot{background:#fff}
.cal-cell.today:not(.selected) .cal-dn{color:var(--accent);font-weight:700}
.cal-cell.empty{pointer-events:none}
.cal-cell.no-entry{opacity:.45;cursor:pointer}
.cal-dn{font-size:13px;color:var(--text);font-weight:500}
.cal-dot{width:4px;height:4px;border-radius:50%;background:var(--accent)}
.cal-dot.hidden{visibility:hidden}
.cal-day-entries{border-top:1px solid var(--border);padding-top:14px}
.cal-day-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.cal-entry-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--bg3);border-radius:var(--radius-sm);margin-bottom:8px}
.cal-entry-desc{font-size:13px;font-weight:600;color:var(--text)}
.cal-entry-sub{font-size:11px;color:var(--text3);margin-top:2px}
.cal-entry-right{display:flex;align-items:center;gap:8px}
.cal-entry-amt{font-size:14px;font-weight:700;color:var(--text)}
.cal-entry-edit{background:none;border:none;cursor:pointer;color:var(--text3);padding:4px;display:flex}
.cal-entry-edit svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cal-no-entries{font-size:13px;color:var(--text3);text-align:center;padding:14px 0}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;backdrop-filter:blur(2px)}
.modal-overlay.open{display:flex;align-items:flex-end}
.modal-sheet{background:var(--bg2);border-radius:24px 24px 0 0;padding:24px 20px 36px;width:100%;box-shadow:0 -8px 32px rgba(0,0,0,.12)}
.modal-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 20px}
.modal-title{font-size:17px;font-weight:700;margin-bottom:20px;letter-spacing:-.3px}
.btn-modal-save{width:100%;height:52px;background:var(--accent);border:none;border-radius:var(--radius-sm);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;box-shadow:var(--shadow-btn);transition:opacity .15s}
.btn-modal-save:active{opacity:.9}
.btn-modal-cancel{width:100%;height:48px;background:var(--bg3);border:none;border-radius:var(--radius-sm);color:var(--text2);font-size:15px;cursor:pointer;margin-top:10px;font-weight:500}

/* SUMMARY CARD */
.summary-card{background:var(--accent);border-radius:var(--radius);padding:24px 20px 22px;margin-bottom:20px;color:#fff;position:relative;overflow:hidden}
.summary-card::after{content:'';position:absolute;right:-20px;top:-20px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.07)}
.sum-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.65;margin-bottom:8px}
.sum-amt{font-size:38px;font-weight:700;letter-spacing:-1.5px;line-height:1;margin-bottom:6px}
.sum-sub{font-size:12px;opacity:.55;font-weight:500}

/* AMOUNT ROW */
.amt-row{display:flex;align-items:center;background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:0 14px;margin-bottom:14px;transition:border-color .18s,box-shadow .18s}
.amt-row:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.amt-prefix{font-size:22px;font-weight:700;color:var(--text3);padding-right:6px}
.amt-input{flex:1;height:56px;border:none;outline:none;font-size:26px;font-weight:700;color:var(--text);letter-spacing:-.5px;font-family:inherit;-webkit-appearance:none;background:transparent}

/* HIST HEADER */
.hist-header{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}
.hist-search{height:36px;border:1.5px solid var(--border);border-radius:20px;padding:0 14px 0 10px;font-size:13px;background:#fff;color:var(--text);outline:none;width:130px;font-family:inherit;transition:border-color .18s}
.hist-search:focus{border-color:var(--accent)}
.hist-header-actions{display:flex;gap:8px;align-items:center}
.cal-link{background:var(--bg3);border:none;border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* HIST ITEM */
.hist-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.hist-btns{display:flex;gap:4px}
.hist-btn{background:var(--bg3);border:none;border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--text3);display:flex;align-items:center;justify-content:center}
.hist-btn.del{color:var(--red)}
.hist-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* RESUMEN (dashboard/analisis/inversiones) */
.subnav{display:flex;gap:4px;background:var(--bg3);padding:4px;border-radius:14px;margin-bottom:18px}
.subnav-btn{flex:1;padding:9px 0;text-align:center;border:none;background:none;border-radius:11px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;font-family:inherit}
.subnav-btn.active{background:var(--bg2);color:var(--accent);box-shadow:var(--shadow-sm)}
.mcard{background:var(--bg2);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.mcard-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.mcard-val{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.4px}
.mcard-sub{font-size:11px;color:var(--text3);margin-top:3px}
.mgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mlegend-row{display:flex;align-items:center;gap:8px;padding:6px 0}
.mlegend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.mlegend-lbl{flex:1;font-size:12px;font-weight:600;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlegend-amt{font-size:11px;font-weight:700;color:var(--text3)}
.mlist-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bg3)}
.mlist-row:last-child{border-bottom:none}
.mlist-name{font-size:12px;font-weight:700;color:var(--text);width:36px;flex-shrink:0;text-transform:capitalize}
.mlist-track{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.mlist-fill{height:5px;background:var(--accent);border-radius:3px}
.mlist-amt{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-box">GP</div>
      <span class="login-logo-name">GastosPRO</span>
    </div>
    <div class="login-title">Hola 👋</div>

      <div class="pass-wrap">
        <input class="finput" type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">

          <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>

<!-- APP -->
<div id="app">
  <div class="topbar">

      <div class="topbar-box">GP</div>

      <span id="top-user"></span>
      <button class="logout-btn" onclick="doLogout()" title="Salir">✕</button>

  <div class="content" id="main-content">

  </div>

  <nav class="bottomnav">
    <button class="nav-tab active" onclick="goTab('vida',this)" id="tab-vida">

      Vida
    </button>
    <button class="nav-tab" onclick="goTab('resumen',this)" id="tab-resumen">

      Historial
    </button>
    <button class="nav-tab" onclick="goTab('config',this)" id="tab-config">

      Ajustes
    </button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="edit-modal" onclick="if(event.target===this)closeEdit()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="edit-modal-title">Editar</div>
    <div id="edit-modal-body"></div>
    <button class="btn-modal-save" onclick="saveEdit()">Guardar cambios</button>
    <button class="btn-modal-cancel" onclick="closeEdit()">Cancelar</button>
  </div>
</div>

<div class="modal-overlay" id="cal-modal" onclick="if(event.target===this)closeCalModal()">
  <div class="cal-modal">
    <div class="modal-handle"></div>
    <div id="cal-modal-body"></div>
    <button class="btn-modal-cancel" style="margin-top:12px" onclick="closeCalModal()">Cerrar</button>
  </div>
</div>

<script>
const SUPA_URL='https://kujzslrpdfbscltnsquv.supabase.co';
const SUPA_KEY='sb_publishable_0XEjYVJ8j5Dlqa6SERapvA_VgOMLzWF';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

async function doLogin(){
  const email=document.getElementById('l-email').value.trim();
  const pass=document.getElementById('l-pass').value;
  const btn=document.getElementById('login-btn');
  const err=document.getElementById('login-err');
  if(!email||!pass){err.textContent='Completá email y contraseña';return;}
  btn.textContent='Entrando...';btn.disabled=true;err.textContent='';
  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error)throw error;
    currentUser=data.user;
    await fetchTC();
    showApp();
  }catch(e){
    err.textContent=e.message==='Invalid login credentials'?'Email o contraseña incorrectos':e.message;
    btn.textContent='Entrar';btn.disabled=false;
  }
}

async function doLogout(){
  await sb.auth.signOut();
  currentUser=null;
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
}

function showApp(){
  document.getElementById('login-screen').style.display='none';
  const app=document.getElementById('app');
  app.style.display='flex';
  const name=currentUser.email.split('@')[0];
  document.getElementById('top-user').textContent=name;
  goTab('vida',document.getElementById('tab-vida'));
}

async function fetchTC(){
  try{
    const r=await fetch('https://dolarapi.com/v1/dolares/blue');
    const d=await r.json();
    tcVal=Math.round(d.venta||d.compra||tcVal);
  }catch(e){}
}

function goTab(tab,btn){
  currentTab=tab;
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  renderTab(tab);
}

function renderTab(tab){
  const el=document.getElementById('main-content');
  if(tab==='vida'){el.innerHTML=formVida();loadHistVida();}
  if(tab==='historial'){
    el.innerHTML='<div style="padding:24px;text-align:center;color:var(--text3);font-size:14px">Cargando...</div>';
    (async()=>{
      if(!histVidaCache.length){
        try{
          const {data:rows}=await sb.from('transacciones')
            .select('id,descripcion,valor,mes,metodo,fuente,cat,notas,created_at')
            .order('created_at',{ascending:false}).limit(500);
          histVidaCache=rows||[];
          (rows||[]).forEach(r=>{editCache[r.id]=r;});
        }catch(e){}
      }
      if(currentTab==='historial')el.innerHTML=renderHistorialTab();
    })();
  }
  if(tab==='config'){el.innerHTML=renderConfigTab();}
  if(tab==='resumen'){
    el.innerHTML='<div style="padding:40px 0;text-align:center;color:var(--text3);font-size:13px">Cargando...</div>';
    loadResumenData().then(()=>{
      if(currentTab!=='resumen')return;
      el.innerHTML=renderResumenShell();
      renderResumenSub();
    });
  }
}

function renderHistorialTab(){
  if(!histVidaCache.length)return'<div style="padding:24px;text-align:center;color:var(--text3);font-size:14px">Sin registros todavía.</div>';
  const byKey={};
  histVidaCache.forEach(r=>{
    const yr=r.created_at?new Date(r.created_at).getFullYear():'';
    const k=r.mes+(yr?'|'+yr:'');
    (byKey[k]=byKey[k]||[]).push(r);
  });
  const MORD=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const sorted=Object.keys(byKey).sort((a,b)=>{
    const [ma,ya]=a.split('|');const [mb,yb]=b.split('|');
    return (parseInt(yb)||0)-(parseInt(ya)||0)||MORD.indexOf(mb)-MORD.indexOf(ma);
  });
  return'<div style="padding:16px 16px 80px">'+
    '<div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:12px">Historial</div>'+
    sorted.map(key=>{
      const [mes,yr]=key.split('|');
      const items=byKey[key];
      const total=items.reduce((s,r)=>s+(parseFloat(r.valor)||0),0);
      const label=mes.charAt(0).toUpperCase()+mes.slice(1)+(yr?' '+yr:'');
      return'<div style="margin-bottom:16px">'+
        '<div style="font-size:12px;font-weight:600;color:var(--text3);letter-spacing:.5px;margin-bottom:6px">'+label+' · '+arsF(total)+'</div>'+
        items.map(r=>'<div style="background:var(--bg2);border-radius:10px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center">'+
          '<div>'+
            '<div style="font-size:13px;font-weight:500;color:var(--text)">'+(r.descripcion||'—')+'</div>'+
            (r.fuente?'<div style="font-size:11px;color:var(--text3)">'+r.fuente+'</div>':'')+
          '</div>'+
          '<div style="font-size:14px;font-weight:700;color:var(--text)">'+arsF(parseFloat(r.valor)||0)+'</div>'+
        '</div>').join('')+
      '</div>';
    }).join('')+
  '</div>';
}

      '<div class="hist-amt">'+amt+'</div>'+

function openEdit(section,id){
  const r=editCache[id];
  if(!r)return;
  editId=id;editSection=section;
  const modal=document.getElementById('edit-modal');
  const title=document.getElementById('edit-modal-title');
  const body=document.getElementById('edit-modal-body');
  if(section==='vida'){
    title.textContent='Editar gasto personal';
    body.innerHTML=
      '<div class="ff" style="margin-bottom:12px"><label class="flabel">Descripción</label><input class="minput" id="em-desc" value="'+( r.descripcion||'')+'"></div>'+
      '<div class="row2" style="margin-bottom:12px">'+
        '<div class="ff"><label class="flabel">Mes</label><select class="minput" id="em-mes">'+mesOpts(r.mes)+'</select></div>'+
        '<div class="ff"><label class="flabel">Monto ARS</label><input class="minput" type="number" id="em-val" value="'+(r.valor||0)+'"></div>'+
      '</div>'+
      '<div class="row2" style="margin-bottom:12px">'+
        '<div class="ff"><label class="flabel">Método</label><select class="minput" id="em-met"><option value="CREDITO" '+(r.metodo==='CREDITO'?'selected':'')+'>Crédito</option><option value="EFECTIVO" '+(r.metodo==='EFECTIVO'?'selected':'')+'>Efectivo</option><option value="TRANSFERENCIA" '+(r.metodo==='TRANSFERENCIA'?'selected':'')+'>Transferencia</option></select></div>'+
        '<div class="ff"><label class="flabel">Fuente</label><select class="minput" id="em-fuente"><option value="">— sin fuente —</option>'+FUENTES.map(f=>'<option value="'+f+'" '+(r.fuente===f?'selected':'')+'>'+f+'</option>').join('')+'</select></div>'+
      '</div>'+
      '<div class="row2" style="margin-bottom:12px">'+
        '<div class="ff"><label class="flabel">Categoría</label><select class="minput" id="em-cat">'+catOpts(CATS_VIDA,r.cat||'OTROS')+'</select></div>'+
        '<div class="ff"><label class="flabel">Notas</label><input class="minput" id="em-notas" value="'+(r.notas||'')+'" placeholder="Detalle..."></div>'+
      '</div>';
  }
  modal.classList.add('open');
}

function closeEdit(){
  document.getElementById('edit-modal').classList.remove('open');
  editId=null;editSection=null;
}

async function saveEdit(){
  const desc=document.getElementById('em-desc').value.trim().toUpperCase();
  const mes=document.getElementById('em-mes').value;
  const val=parseFloat(document.getElementById('em-val').value)||0;
  if(!desc||!val){showToast('Completá los campos');return;}
  const btn=document.querySelector('.btn-modal-save');
  btn.disabled=true;btn.textContent='Guardando...';
  try{
    if(editSection==='vida'){
      const met=document.getElementById('em-met').value;
      const fuente=document.getElementById('em-fuente').value;
      const cat=document.getElementById('em-cat').value;
      const notas=document.getElementById('em-notas').value.trim();
      await sb.from('transacciones').update({descripcion:desc,mes,metodo:met,valor:val,usd:val/tcVal,fuente,cat,notas:notas||null}).eq('id',editId);
    }else{
      await sb.from('cuentas_movimientos').update({descripcion:desc,mes,valor_ars:val,valor_usd:parseFloat((val/tcVal).toFixed(2))}).eq('id',editId);
    }
    showToast('✓ Cambios guardados');
    closeEdit();
    if(editSection==='vida'||currentTab==='vida')loadHistVida();
    if(calModal.section===editSection)loadCalModalMonth();
  }catch(e){showToast('Error: '+e.message);}
  btn.disabled=false;btn.textContent='Guardar cambios';
}

async function deleteVida(id){
  if(!confirm('¿Eliminar este gasto?'))return;
  try{
    await sb.from('transacciones').delete().eq('id',id);
    delete editCache[id];
    showToast('Gasto eliminado');
    loadHistVida();
    if(calModal.section==='vida')loadCalModalMonth();
  }catch(e){showToast('Error: '+e.message);}
}

function renderHistItems(list){
  const box=document.getElementById('hist-vida');
  if(!box)return;
  if(!list.length){box.innerHTML='<div class="hist-empty">Sin resultados</div>';return;}
  const visible=list.slice(0,3);
  const rest=list.length-3;
  box.innerHTML=visible.map(r=>{
    const metIcon=r.metodo==='EFECTIVO'?'💵':r.metodo==='TRANSFERENCIA'?'🏦':'💳';
    const d=r.created_at?new Date(r.created_at):null;
    const fechaStr=d?d.toLocaleDateString('es-AR',{day:'numeric',month:'short'}):'';
    const sub=(fechaStr?fechaStr+' · ':'')+[r.fuente,r.notas].filter(Boolean).join(' · ');
    return histItem(r.id,'vida',metIcon,r.descripcion||'–',sub,arsF(r.valor));
  }).join('')+
  (rest>0?'<button onclick="openCalModal(\'vida\')" style="width:100%;margin-top:8px;padding:12px;background:var(--bg3);border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;color:var(--text2);cursor:pointer">Ver todos ('+list.length+') →</button>':'');
}

function filterHist(q){
  const lq=(q||'').toLowerCase();
  const filtered=lq?histVidaCache.filter(r=>
    (r.descripcion||'').toLowerCase().includes(lq)||
    (r.fuente||'').toLowerCase().includes(lq)||
    (r.notas||'').toLowerCase().includes(lq)||
    (r.cat||'').toLowerCase().includes(lq)
  ):histVidaCache;
  renderHistItems(filtered);
}

async function loadHistVida(){
  const box=document.getElementById('hist-vida');
  try{
    const {data,error}=await sb.from('transacciones')
      .select('id,descripcion,valor,mes,metodo,fuente,cat,notas,created_at')
      .order('created_at',{ascending:false}).limit(500);
    if(error)throw error;
    histVidaCache=data||[];
    data.forEach(r=>{editCache[r.id]=r;});
    updateMesTotal();
    if(!box)return;
    if(!data.length){box.innerHTML='<div class="hist-empty">Sin gastos cargados aún</div>';return;}
    const q=document.getElementById('hist-search')?.value||'';
    filterHist(q);
  }catch(e){if(box)box.innerHTML='<div class="hist-empty">Error al cargar</div>';}
}


/* ── CALENDAR MODAL ── */
let calModal={section:null,year:new Date().getFullYear(),month:new Date().getMonth(),selected:null,records:[]};

async function openCalModal(section){
  calModal.section=section;
  calModal.selected=null;
  const today=new Date();
  calModal.year=today.getFullYear();
  calModal.month=today.getMonth();
  document.getElementById('cal-modal').classList.add('open');
  await loadCalModalMonth();
}

function closeCalModal(){
  document.getElementById('cal-modal').classList.remove('open');
}

async function loadCalModalMonth(){
  const body=document.getElementById('cal-modal-body');
  body.innerHTML='<div style="text-align:center;padding:20px;color:var(--text3);font-size:13px">Cargando...</div>';
  const {section,year,month}=calModal;
  const from=new Date(year,month,1).toISOString();
  const to=new Date(year,month+1,0,23,59,59).toISOString();
  try{
    let q;
    const mesStr=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][month];
    q=await sb.from('transacciones').select('id,descripcion,valor,mes,metodo,fuente,cat,notas,created_at').eq('mes',mesStr).order('created_at',{ascending:false});
    if(q.error)throw q.error;
    calModal.records=q.data||[];
    q.data.forEach(r=>{editCache[r.id]=r;});
    renderCalModal();
  }catch(e){body.innerHTML='<div style="text-align:center;padding:20px;color:var(--red);font-size:13px">Error al cargar</div>';}
}

function renderCalModal(){
  const {year,month,selected,records}=calModal;
  const daysWithEntries=new Set(records.map(r=>{
    const d=new Date(r.created_at);
    if(d.getFullYear()===year&&d.getMonth()===month)return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    return year+'-'+(month+1)+'-1';
  }));
  const today=new Date();
  const todayKey=today.getFullYear()+'-'+(today.getMonth()+1)+'-'+today.getDate();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const monthName=new Date(year,month,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'});
  const DOW=['D','L','M','X','J','V','S'];
  let cells='';
  for(let i=0;i<firstDay;i++)cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const key=year+'-'+(month+1)+'-'+d;
    const isSel=selected===key;
    const isToday=key===todayKey;
    const hasEntry=daysWithEntries.has(key);
    cells+='<div class="cal-cell'+(isSel?' selected':'')+(isToday&&!isSel?' today':'')+(hasEntry?'':' no-entry')+'" onclick="selectCalModalDay(\''+key+'\')">'+
      '<span class="cal-dn">'+d+'</span>'+
      '<span class="cal-dot'+(hasEntry?'':' hidden')+'"></span>'+
    '</div>';
  }
  let entriesHtml='';
  if(selected){
    const [y,m,d]=selected.split('-').map(Number);
    const dayRecords=records.filter(r=>{const rd=new Date(r.created_at);return rd.getFullYear()===y&&(rd.getMonth()+1)===m&&rd.getDate()===d;});
    const dayLbl=new Date(y,m-1,d).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
    const mesDia=MESES[m-1];
    entriesHtml='<div class="cal-day-entries">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'+
        '<div class="cal-day-lbl" style="margin:0">'+dayLbl+'</div>'+
        '<button onclick="addGastoForDate(\''+mesDia+'\')" style="background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer">＋ Agregar</button>'+
      '</div>'+
      (dayRecords.length?dayRecords.map(r=>calEntryItem(r)).join(''):'<div class="cal-no-entries">Sin gastos este día</div>')+
    '</div>';
  }
  document.getElementById('cal-modal-body').innerHTML=
    '<div class="cal-modal-header">'+
      '<button class="cal-modal-nav" onclick="calModalNav(-1)">‹</button>'+
      '<span class="cal-modal-month">'+monthName.charAt(0).toUpperCase()+monthName.slice(1)+'</span>'+
      '<button class="cal-modal-nav" onclick="calModalNav(1)">›</button>'+
    '</div>'+
    '<div class="cal-grid">'+DOW.map(d=>'<div class="cal-dow">'+d+'</div>').join('')+cells+'</div>'+
    entriesHtml;
}

function selectCalModalDay(key){
  calModal.selected=calModal.selected===key?null:key;
  renderCalModal();
}

async function calModalNav(dir){
  let m=calModal.month+dir,y=calModal.year;
  if(m>11){m=0;y++;}else if(m<0){m=11;y--;}
  calModal.month=m;calModal.year=y;calModal.selected=null;
  await loadCalModalMonth();
}

function calEntryItem(r){
  const isVida=calModal.section==='vida';
  const amt=isVida?arsF(r.valor):arsF(r.valor_ars);
  const sub=isVida?(r.fuente||r.metodo||''):(r.creado_por||'');
  const icon=isVida?(r.metodo==='EFECTIVO'?'💵':r.metodo==='TRANSFERENCIA'?'🏦':'💳'):'👥';
  return'<div class="cal-entry-item">'+
    '<div>'+
      '<div class="cal-entry-desc">'+icon+' '+(r.descripcion||'–')+'</div>'+
      (sub?'<div class="cal-entry-sub">'+sub+'</div>':'')+
    '</div>'+
    '<div class="cal-entry-right">'+
      '<span class="cal-entry-amt">'+amt+'</span>'+
      '<button class="cal-entry-edit" onclick="closeCalModal();openEdit(\''+calModal.section+'\',\''+r.id+'\')">'+
        '<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>'+
      '</button>'+
    '</div>'+
  '</div>';
}

function addGastoForDate(mes){
  closeCalModal();
  setTimeout(()=>{
    const sel=document.getElementById('v-mes');
    if(sel){sel.value=mes;}
    const d=document.getElementById('v-desc');
    if(d){d.focus();d.scrollIntoView({behavior:'smooth',block:'center'});}
  },300);
}

function mesOpts(selected){
  return MESES.map(m=>'<option value="'+m+'" '+(m===selected?'selected':'')+'>'+m.charAt(0).toUpperCase()+m.slice(1)+'</option>').join('');
}
function catOpts(cats,selected){
  return cats.map(c=>'<option value="'+c+'" '+(c===selected?'selected':'')+'>'+(CATLAB[c]||c)+'</option>').join('');
}

function fechaHoyStr(){
  const d=new Date();
  return d.toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}

function updateMesTotal(){
  const mes=mesActual();
  const filtered=histVidaCache.filter(r=>r.mes===mes);
  const total=filtered.reduce((s,r)=>s+(r.valor||0),0);
  const el=document.getElementById('mes-total');
  const sub=document.getElementById('mes-count');
  if(el)el.textContent=arsF(total);
  if(sub)sub.textContent=filtered.length+' gasto'+(filtered.length!==1?'s':'')+' registrado'+(filtered.length!==1?'s':'');
}

function formVida(){
  const mes=mesActual();
  const mesLabel=mes.charAt(0).toUpperCase()+mes.slice(1);
  const fuenteOpts=FUENTES.map(f=>'<option value="'+f+'">'+f+'</option>').join('');
  return'<div class="summary-card">'+
      '<div class="sum-label">Total · '+mesLabel+'</div>'+
      '<div class="sum-amt" id="mes-total">—</div>'+
      '<div class="sum-sub" id="mes-count">cargando...</div>'+
    '</div>'+
    '<div class="form-card">'+
      '<div class="ff"><label class="flabel">¿En qué gastaste?</label>'+
        '<input class="minput" type="text" id="v-desc" placeholder="Rappi, Netflix, YPF..." autocomplete="off">'+
      '</div>'+
      '<label class="flabel">Monto</label>'+
      '<div class="amt-row">'+
        '<span class="amt-prefix">$</span>'+
        '<input class="amt-input" type="number" id="v-val" inputmode="decimal" placeholder="0">'+
      '</div>'+
      '<div class="row2" style="margin-bottom:14px">'+
        '<div class="ff"><label class="flabel">Mes</label><select class="minput" id="v-mes">'+mesOpts(mes)+'</select></div>'+
        '<div class="ff"><label class="flabel">Método</label><select class="minput" id="v-met"><option value="CREDITO">Crédito</option><option value="EFECTIVO">Efectivo</option><option value="TRANSFERENCIA">Transferencia</option></select></div>'+
      '</div>'+
      '<div class="row2" style="margin-bottom:14px">'+
        '<div class="ff"><label class="flabel">Categoría</label><select class="minput" id="v-cat">'+catOpts(CATS_VIDA,'OTROS')+'</select></div>'+
        '<div class="ff"><label class="flabel">Fuente</label><select class="minput" id="v-fuente"><option value="">—</option>'+fuenteOpts+'</select></div>'+
      '</div>'+
      '<div class="ff"><label class="flabel">Notas</label>'+
        '<input class="minput" type="text" id="v-notas" placeholder="Detalle adicional (opcional)">'+
      '</div>'+
      '<button class="btn-save" onclick="saveVida()">Guardar gasto</button>'+
    '</div>';
}


async function saveVida(){
  const mes=document.getElementById('v-mes').value;
  const cat=document.getElementById('v-cat').value;
  const desc=document.getElementById('v-desc').value.trim();
  const val=parseFloat(document.getElementById('v-val').value);
  const met=document.getElementById('v-met').value;
  const fuente=document.getElementById('v-fuente').value;
  const notas=document.getElementById('v-notas').value.trim();
  if(!desc||!val){showToast('Completá descripción y monto');return;}
  const btn=document.querySelector('.btn-save');
  btn.disabled=true;btn.textContent='Verificando...';
  try{
    if(fuente&&val){
      const {data:existing}=await sb.from('transacciones').select('descripcion').eq('mes',mes).eq('valor',val).eq('fuente',fuente).limit(1);
      if(existing&&existing.length>0){
        const dupDesc=existing[0].descripcion;
        const ok=confirm('⚠️ Ya existe un gasto de $'+val.toLocaleString('es-AR')+' en '+mes+' con '+fuente+':\n"'+dupDesc+'"\n\n¿Querés guardarlo igual?');
        if(!ok){btn.disabled=false;btn.textContent='Guardar gasto';return;}
      }
    }
    btn.textContent='Guardando...';
    await sb.from('transacciones').insert({
      user_id:currentUser.id,mes,descripcion:desc.toUpperCase(),
      metodo:met,valor:val,usd:val/tcVal,cat,fuente,notas:notas||null
    });
    showToast('✓ Gasto guardado');
    renderTab('vida');
    loadHistVida();
  }catch(e){showToast('Error: '+e.message);btn.disabled=false;btn.textContent='✓ Guardar gasto';}
}

/* ── RESUMEN: dashboard/analisis/inversiones ── */
async function loadResumenData(){
  try{
    const [txRes,invRes]=await Promise.all([
      sb.from('transacciones').select('mes,descripcion,metodo,valor,usd,cat,fuente,fecha').order('created_at',{ascending:true}),
      sb.from('cuentas_movimientos').select('*').order('created_at',{ascending:false})
    ]);
    resumenTxData=(txRes.data||[]).map(r=>({mes:r.mes,desc:r.descripcion,metodo:r.metodo,valor:parseFloat(r.valor)||0,usd:parseFloat(r.usd)||0,cat:r.cat,fuente:r.fuente||'',fecha:r.fecha||''}));
    resumenInvData=(invRes.data||[]).filter(r=>r.cuenta==='INVERSIONES');
  }catch(e){}
}

function rMesesActivos(){return MESES.filter(m=>resumenTxData.some(t=>t.mes===m));}
function rMesTotARS(m){return resumenTxData.filter(t=>t.mes===m).reduce((s,t)=>s+t.valor,0);}

function renderResumenShell(){
  return '<div class="subnav">'+
    '<button class="subnav-btn'+(resumenSub==='dashboard'?' active':'')+'" onclick="switchResumenSub(\'dashboard\')">Dashboard</button>'+
    '<button class="subnav-btn'+(resumenSub==='analisis'?' active':'')+'" onclick="switchResumenSub(\'analisis\')">Análisis</button>'+
    '<button class="subnav-btn'+(resumenSub==='inversiones'?' active':'')+'" onclick="switchResumenSub(\'inversiones\')">Inversión</button>'+
  '</div>'+
  '<div id="resumen-sub-content"></div>';
}

function switchResumenSub(sub){
  resumenSub=sub;
  document.querySelectorAll('.subnav-btn').forEach((b,i)=>b.classList.toggle('active',['dashboard','analisis','inversiones'][i]===sub));
  renderResumenSub();
}

function renderResumenSub(){
  const box=document.getElementById('resumen-sub-content');
  if(!box)return;
  if(resumenSub==='dashboard')box.innerHTML=buildResumenDashboard();
  if(resumenSub==='analisis'){box.innerHTML=buildResumenAnalisisShell();drawResumenAnalisisCharts();}
  if(resumenSub==='inversiones'){box.innerHTML=buildResumenInvShell();drawResumenInvCharts();}
}

function buildResumenDashboard(){
  if(!resumenTxData.length)return'<div style="text-align:center;padding:40px 0;color:var(--text3);font-size:13px">Sin gastos cargados todavía.</div>';
  const T=tcVal;
  const meses=rMesesActivos();
  const totalARS=resumenTxData.reduce((s,t)=>s+t.valor,0);
  const totalUSD=resumenTxData.reduce((s,t)=>s+(t.usd>0?t.usd:t.valor/T),0);
  const prom=meses.length?totalARS/meses.length:0;
  const ultMes=meses.length?rMesTotARS(meses[meses.length-1]):0;
  const antMes=meses.length>1?rMesTotARS(meses[meses.length-2]):0;
  const cambio=antMes>0?((ultMes-antMes)/antMes*100):null;
  const ef=resumenTxData.filter(t=>t.metodo==='EFECTIVO').reduce((s,t)=>s+t.valor,0);
  return '<div class="mcard" style="background:var(--accent);color:#fff">'+
      '<div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:6px">Total general'+(meses.length?' · '+meses[0].slice(0,3)+' – '+meses[meses.length-1].slice(0,3):'')+'</div>'+
      '<div style="font-size:28px;font-weight:800;letter-spacing:-.8px">'+arsF(totalARS)+'</div>'+
      '<div style="font-size:12px;opacity:.75;margin-top:2px">U$S '+Math.round(totalUSD).toLocaleString('es-AR')+'</div>'+
    '</div>'+
    '<div class="mcard"><div class="mcard-lbl">Promedio mensual</div><div class="mcard-val">'+arsF(prom)+'</div></div>'+
    '<div class="mgrid2">'+
      '<div class="mcard" style="margin-bottom:0"><div class="mcard-lbl">Último mes</div><div class="mcard-val" style="font-size:16px">'+arsF(ultMes)+'</div>'+(cambio!==null?'<div class="mcard-sub" style="color:'+(cambio>=0?'#e11d48':'#059669')+'">'+(cambio>=0?'▲':'▼')+Math.abs(Math.round(cambio))+'% vs anterior</div>':'')+'</div>'+
      '<div class="mcard" style="margin-bottom:0"><div class="mcard-lbl">Efectivo</div><div class="mcard-val" style="font-size:16px">'+(totalARS>0?Math.round(ef/totalARS*100):0)+'%</div><div class="mcard-sub">'+arsF(ef)+'</div></div>'+
    '</div>'+
    buildCostoCaroCard();
}

function buildCostoCaroCard(){
  const caroCats=['SUELDO','931','BOLETAS SINDICALES'];
  const caroTxs=resumenTxData.filter(function(t){return caroCats.indexOf(t.cat)>-1;});
  const totalCaro=caroTxs.reduce(function(s,t){return s+t.valor;},0);
  if(!totalCaro)return'';
  const desglose=caroCats.map(function(c){
    const v=resumenTxData.filter(function(t){return t.cat===c;}).reduce(function(s,t){return s+t.valor;},0);
    if(!v)return'';
    const pct=Math.round(v/totalCaro*100);
    return '<div class="mlegend-row"><span class="mlegend-dot" style="background:'+CATCOL[c]+'"></span><span class="mlegend-lbl">'+CATLAB[c]+'</span><span class="mlegend-amt">'+arsF(v)+' ('+pct+'%)</span></div>';
  }).join('');
  return '<div class="mcard"><div class="mcard-lbl">Costo Caro</div><div class="mcard-val" style="margin-bottom:8px">'+arsF(totalCaro)+'</div>'+desglose+'</div>';
}

function resumenChartColors(){return{text3:'#b0ada6',grid:'rgba(0,0,0,.05)',barDim:'#c9c2ff'};}

function buildResumenAnalisisShell(){
  const meses=rMesesActivos();
  if(!meses.length)return '<div style="text-align:center;padding:40px 0;color:var(--text3);font-size:13px">Sin datos cargados</div>';
  return '<div class="mcard"><div class="mcard-lbl">Evolución de gastos</div><div style="position:relative;height:160px;margin-top:8px"><canvas id="mcBar"></canvas></div></div>'+
    '<div class="mcard"><div class="mcard-lbl" style="margin-bottom:10px">Distribución por categoría</div>'+
      '<div style="display:flex;align-items:center;gap:16px">'+
        '<div style="position:relative;height:130px;width:130px;flex-shrink:0"><canvas id="mcDonut"></canvas></div>'+
        '<div id="m-donut-legend" style="flex:1;min-width:0"></div>'+
      '</div>'+
    '</div>'+
    '<div class="mcard"><div class="mcard-lbl" style="margin-bottom:6px">Resumen mensual</div><div id="m-mes-list"></div></div>';
}

function drawResumenAnalisisCharts(){
  const T=tcVal;
  const meses=rMesesActivos();
  if(!meses.length)return;
  const cc=resumenChartColors();
  const maxV=Math.max.apply(null,meses.map(m=>rMesTotARS(m)));
  try{
    if(mCharts.bar)mCharts.bar.destroy();
    const cvs=document.getElementById('mcBar');
    if(cvs)mCharts.bar=new Chart(cvs.getContext('2d'),{type:'bar',data:{labels:meses.map(m=>m.slice(0,3)),datasets:[{data:meses.map(m=>Math.round(rMesTotARS(m))),backgroundColor:meses.map((m,i)=>i===meses.length-1?'#5b4eff':cc.barDim),borderRadius:5,maxBarThickness:26}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{grid:{color:cc.grid},ticks:{color:cc.text3,font:{size:9},callback:function(v){return(v/1000000).toFixed(1)+'M';}}},x:{grid:{display:false},ticks:{color:cc.text3,font:{size:9}}}}}});
  }catch(e){}
  try{
    const catTot=CATS_VIDA.map(c=>({c:c,v:resumenTxData.filter(t=>t.cat===c).reduce((s,t)=>s+t.valor,0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
    const top=catTot.slice(0,5);
    const restV=catTot.slice(5).reduce((s,x)=>s+x.v,0);
    const donutData=restV>0?top.concat([{c:null,v:restV}]):top;
    const totCat=donutData.reduce((s,x)=>s+x.v,0);
    if(mCharts.donut)mCharts.donut.destroy();
    const cvs2=document.getElementById('mcDonut');
    if(cvs2)mCharts.donut=new Chart(cvs2.getContext('2d'),{type:'doughnut',data:{labels:donutData.map(function(x){return x.c?CATLAB[x.c]:'Otros';}),datasets:[{data:donutData.map(function(x){return x.v;}),backgroundColor:donutData.map(function(x){return x.c?CATCOL[x.c]:'#c7c7cf';}),borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{display:false}}}});
    const legendEl=document.getElementById('m-donut-legend');
    if(legendEl)legendEl.innerHTML=donutData.map(function(x){
      const pct=totCat>0?Math.round(x.v/totCat*100):0;
      return '<div class="mlegend-row"><span class="mlegend-dot" style="background:'+(x.c?CATCOL[x.c]:'#c7c7cf')+'"></span><span class="mlegend-lbl">'+(x.c?CATLAB[x.c]:'Otros')+'</span><span class="mlegend-amt">'+pct+'%</span></div>';
    }).join('');
  }catch(e){}
  const listEl=document.getElementById('m-mes-list');
  if(listEl){
    listEl.innerHTML=meses.slice().reverse().map(function(m){
      const v=rMesTotARS(m);
      return '<div class="mlist-row"><div class="mlist-name">'+m.slice(0,3)+'</div><div class="mlist-track"><div class="mlist-fill" style="width:'+Math.round(v/maxV*100)+'%"></div></div><div class="mlist-amt">'+arsF(v)+'</div></div>';
    }).join('');
  }
}

function buildResumenInvShell(){
  if(!resumenInvData.length)return '<div style="text-align:center;padding:40px 0;color:var(--text3);font-size:13px">Sin movimientos de inversión</div>';
  const T=tcVal;
  const totalARS=resumenInvData.reduce(function(s,m){return s+(parseFloat(m.valor_ars)||0);},0);
  const totalUSD=resumenInvData.reduce(function(s,m){return s+(parseFloat(m.valor_usd)||0);},0);
  return '<div class="mgrid2">'+
      '<div class="mcard" style="margin-bottom:0"><div class="mcard-lbl">Capital ARS</div><div class="mcard-val" style="font-size:16px">'+arsF(totalARS)+'</div></div>'+
      '<div class="mcard" style="margin-bottom:0"><div class="mcard-lbl">Capital USD</div><div class="mcard-val" style="font-size:16px;color:#0891b2">U$S '+Math.round(totalUSD).toLocaleString('es-AR')+'</div></div>'+
    '</div>'+
    '<div class="mcard"><div class="mcard-lbl">Valor total hoy</div><div class="mcard-val">'+arsF(totalARS+totalUSD*T)+'</div></div>'+
    '<div class="mcard"><div class="mcard-lbl" style="margin-bottom:6px">Últimos movimientos</div><div id="m-inv-list"></div></div>';
}

function drawResumenInvCharts(){
  const listEl=document.getElementById('m-inv-list');
  if(!listEl)return;
  const T=tcVal;
  const top=resumenInvData.slice().sort(function(a,b){
    return((parseFloat(b.valor_ars)||0)+(parseFloat(b.valor_usd)||0)*T)-((parseFloat(a.valor_ars)||0)+(parseFloat(a.valor_usd)||0)*T);
  }).slice(0,8);
  listEl.innerHTML=top.map(function(m){
    const v=(parseFloat(m.valor_ars)||0)+(parseFloat(m.valor_usd)||0)*T;
    return '<div class="mlist-row"><div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(m.descripcion||'–')+'</div><div style="font-size:10px;color:var(--text3)">'+(m.fecha||'')+'</div></div><div class="mlist-amt">'+arsF(v)+'</div></div>';
  }).join('');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

(async()=>{
  const {data}=await sb.auth.getSession();
  if(data.session){currentUser=data.session.user;await fetchTC();showApp();}
})();
</script>
